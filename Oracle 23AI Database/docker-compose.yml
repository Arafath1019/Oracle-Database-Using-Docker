services:
  oracle-db:
    container_name: oracle-23ai
    image: container-registry.oracle.com/database/free:latest
    ports:
      - "1522:1521"   # Standard Oracle port
      - "5501:5500"   # EM Express (5501 avoids conflict with local Oracle on 5500)
    environment:
      - ORACLE_PWD=orcl123  # Required: Set your system password
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: always

volumes:
  oracle_data: